[workspace]
resolver = "3"
members = [
    "crates/otas-types",
    "crates/otas-ports",
    "crates/otas-ifc",
    "crates/otas-policy",
    "crates/otas-audit",
    "crates/otas-broker",
    "crates/otas-ipc",
    "crates/otas-testkit",
    "crates/otas-adapter-linux",
    "crates/otasd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
async-trait = "0.1"
capnp = "0.27"
capnp-rpc = "0.27"
capnpc = "0.27"
futures = "0.3"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["macros", "rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

otas-types = { path = "crates/otas-types" }
otas-ports = { path = "crates/otas-ports" }
otas-ifc = { path = "crates/otas-ifc" }
otas-policy = { path = "crates/otas-policy" }
otas-audit = { path = "crates/otas-audit" }
otas-broker = { path = "crates/otas-broker" }
otas-ipc = { path = "crates/otas-ipc" }
otas-testkit = { path = "crates/otas-testkit" }
otas-adapter-linux = { path = "crates/otas-adapter-linux" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
