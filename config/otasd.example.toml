# otasd の設定の例
#
#   otasd --config config/otasd.example.toml

# 状態を置くディレクトリ（監査ログ audit.jsonl、人間向けの窓口 console.sock、タスクのログ tasks/）
# 所有者だけが使える権限（0700）に設定される。
state_dir = "/var/lib/otas"

# サンドボックスの起動役（otas-adapter-linux の otas-sandbox-exec）
launcher = "/usr/local/libexec/otas-sandbox-exec"

[policy.external_requires]
# 外部に作用する操作（送信、クラウドのモデルへの入力など）を許すのに必要な実行環境の保証。
# 既定値は Linux のサンドボックスが現在保証できる範囲。保証を上げたら、ここも上げる。
fs_isolation = "strong"
net_isolation = "strong"
syscall_filter = "weak"
snapshot = "absent"

# サンドボックスの方式。
#   landlock  : Landlock と seccomp だけ（特権不要）。作業領域はコピー方式で、OTAS_DATA の場所に見える
#   namespace : 名前空間も使う（otasd を root で動かす）。作業領域は OverlayFS で /data として見え、
#               それ以外のパス（/etc/passwd など）はサンドボックスの中に存在しない。タスクは uid/gid で動く
# サンドボックスの方式。
#   landlock  : Landlock と seccomp だけ（特権不要。作業領域はコピー）
#   namespace : 名前空間も使う（デーモンを root で動かし、タスクは uid/gid に切り替える。作業領域は OverlayFS）
#   rootless  : 名前空間をユーザー名前空間の中で使う（デーモンを一般ユーザーで動かす。タスクはケーパビリティなし）
#               Ubuntu 23.10 以降は packaging/apparmor/otas-sandbox-exec のプロファイルが必要
[sandbox]
mode = "landlock"
# uid = 1000
# gid = 1000
# デーモンに任された cgroup（systemd のユニットで Delegate=yes を指定し、その cgroup を書く）。
# 指定すると、タスクごとにメモリ・プロセス数・CPU の上限をかけられる（limits の memory_bytes・processes・cpu_percent）。
# cgroup = "/sys/fs/cgroup/system.slice/otasd.service"

# 版の方式。hardlink（既定、保証 Weak）か btrfs（読み取り専用スナップショット、保証 Strong）。
# btrfs は state_dir を Btrfs 上に置き、store/live をサブボリュームとして用意し、sandbox を namespace にする。
[data]
versions = "hardlink"

# 範囲ごとのラベル。その範囲を作業領域に見せたタスクは、このラベルを持つ。
# 正本は state_dir/store/live にあり、論理パス /data として扱う。
[[data.labels]]
path = "/data/mail"
labels = ["private"]

# モデル。エージェントは id で指定し、権限 {"kind": "model", "pattern": "<id>"} で使えるようになる。
# API キーは設定ファイルに書かず、環境変数名（api_key_env）かファイル（api_key_file）で渡す。
# キーはデーモンの中だけで使い、サンドボックスのエージェントには渡さない。
[[models]]
id = "claude"
provider = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
effort = "high"            # low / medium / high / xhigh / max
# fallbacks = true         # 分類器に断られたとき、サーバ側で別のモデルに切り替える（既定で有効）

# ローカルモデル（Ollama の例）。local = true はループバックアドレスのときだけ指定できる。
[[models]]
id = "local"
provider = "openai_compatible"
model = "llama3.1"
base_url = "http://127.0.0.1:11434/v1"
local = true

[demo]
# 動作確認用のツール（demo.*）を登録する。本番では false にする。
tools = false
